# ════════════════════════════════════════════════════════════════════════════
#  ERP — النشر إلى AwardSpace + جلب مصدر الإجازات
#  ---------------------------------------------------------------------------
#  لماذا هذا الملف؟
#    AwardSpace تحجب كل اتصال صادر خارج خادمها، فلا تستطيع الاستضافة أن تسحب
#    من GitHub ولا أن تقرأ https://fifthday.free.je.
#    الحل: GitHub هو من يدفع — يجلب ملف الإجازات ويرفع كل شيء عبر FTP.
#
#  الأسرار المطلوبة (Settings ← Secrets and variables ← Actions):
#    FTP_HOST   مثال: ftp.awardspace.net
#    FTP_USER   اسم مستخدم FTP من لوحة AwardSpace
#    FTP_PASS   كلمة مروره
#    FTP_DIR    مثال: /amnaai.atwebpages.com/ERP
# ════════════════════════════════════════════════════════════════════════════
name: Deploy to AwardSpace

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'      # كل ساعة: تحديث ملف الإجازات
  workflow_dispatch:           # زر تشغيل يدوي من تبويب Actions

concurrency:
  group: deploy-awardspace     # لا نشرَين في وقت واحد
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تجهيز مجلد الرفع
        run: |
          mkdir -p out/data
          cp -r public/. out/
          echo "ملفات الموقع:"; ls -1 out

      - name: جلب مصدر الإجازات
        id: leave
        run: |
          set +e
          curl -fsSL --max-time 60 --retry 2 --retry-delay 5 \
               -A 'ERP-Deploy' \
               "https://fifthday.free.je/leave_api.php" -o out/data/leave.json
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::warning::تعذّر جلب مصدر الإجازات (رمز $rc) — سيُرفع الكود وحده وتبقى النسخة السابقة على الخادم"
            rm -f out/data/leave.json
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import json, sys
          d = json.load(open('out/data/leave.json'))
          rows = d.get('employees') or d.get('data') or []
          assert isinstance(rows, list) and rows, 'الملف لا يحوي سجلات'
          seen = {r.get('email') or r.get('full_name') for r in rows}
          print(f"سجلات: {len(rows)} · أشخاص مميّزون: {len(seen)}")
          PY
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      - name: التحقق قبل الرفع
        run: |
          test -f out/index.php   || { echo "::error::index.php مفقود"; exit 1; }
          test -f out/style.css   || { echo "::error::style.css مفقود"; exit 1; }
          test -f out/app.js      || { echo "::error::app.js مفقود"; exit 1; }
          if [ -e out/config.php ]; then
            echo "::error::config.php موجود في المستودع — احذفه فوراً وغيّر كل كلمات المرور"; exit 1
          fi
          echo "حجم الرفع: $(du -sh out | cut -f1)"

      - name: الرفع عبر FTP
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
          D: ${{ secrets.FTP_DIR }}
        run: |
          if [ -z "$H" ] || [ -z "$U" ] || [ -z "$P" ] || [ -z "$D" ]; then
            echo "::error::أسرار FTP غير مضبوطة — راجع Settings ← Secrets and variables ← Actions"; exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # كلمة المرور تُمرَّر عبر البيئة لا في سطر الأوامر،
          # فلا تظهر في قائمة العمليات ولا تنكسر بالرموز الخاصة
          export LFTP_PASSWORD="$P"

          SETTINGS="set ftp:ssl-allow true; set ftp:ssl-force false;
                    set ssl:verify-certificate no; set net:timeout 20;
                    set net:max-retries 3; set mirror:parallel-transfer-count 3;"
          MIRROR="mirror -R --verbose --ignore-time
                  --exclude-glob config.php --exclude-glob deploy.log
                  --exclude-glob .deploy-state.json --exclude-glob probe.php
                  out/ '$D'; bye;"

          # المحاولة الأولى: كلمة المرور من البيئة
          if lftp -c "$SETTINGS open -u '$U' --env-password '$H'; $MIRROR"; then
            echo "تم الرفع"
          else
            echo "::warning::تعذّرت الطريقة الأولى — إعادة المحاولة بصيغة أخرى"
            # المحاولة الثانية: لإصدارات lftp التي لا تدعم --env-password
            lftp -c "$SETTINGS open -u \"\$U\",\"\$LFTP_PASSWORD\" \"\$H\"; $MIRROR"
          fi

      - name: الخلاصة
        run: |
          {
            echo "### تم النشر"
            echo ""
            echo "| العنصر | الحالة |"
            echo "|---|---|"
            echo "| الكود | مرفوع |"
            echo "| ملف الإجازات | ${{ steps.leave.outputs.fetched == 'true' && 'مُحدَّث' || 'لم يُجلب — بقيت النسخة السابقة' }} |"
            echo "| commit | \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "البوابة: https://amnaai.atwebpages.com/ERP/"
          } >> "$GITHUB_STEP_SUMMARY"
