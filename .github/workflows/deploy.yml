# ════════════════════════════════════════════════════════════════════════════
#  ERP — النشر إلى AwardSpace + جلب مصدر الإجازات
#  ---------------------------------------------------------------------------
#  لماذا هذا الملف؟
#    AwardSpace تحجب كل اتصال صادر خارج خادمها، فلا تستطيع الاستضافة أن تسحب
#    من GitHub ولا أن تقرأ https://fifthday.free.je.
#    الحل: GitHub هو من يدفع — يجلب ملف الإجازات ويرفع كل شيء عبر FTP.
#
#  الأسرار المطلوبة (Settings ← Secrets and variables ← Actions):
#    FTP_HOST   مثال: ftp.awardspace.net
#    FTP_USER   اسم مستخدم FTP من لوحة AwardSpace
#    FTP_PASS   كلمة مروره
#    FTP_DIR    مثال: /amnaai.atwebpages.com/ERP
# ════════════════════════════════════════════════════════════════════════════
name: Deploy to AwardSpace

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'      # كل ساعة: تحديث ملف الإجازات
  workflow_dispatch:           # زر تشغيل يدوي من تبويب Actions

concurrency:
  group: deploy-awardspace     # لا نشرَين في وقت واحد
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تجهيز مجلد الرفع
        run: |
          mkdir -p out/data
          cp -r public/. out/
          echo "ملفات الموقع:"; ls -1 out

      - name: جلب مصدر الإجازات
        id: leave
        env:
          LEAVE_URL: https://fifthday.free.je/leave_api.php
        run: |
          # الاستضافة المجانية ترد على الأدوات الآلية بصفحة تحقّق JavaScript
          # بدل الـ JSON. نتصرّف كمتصفح، ونحلّ التحقّق إن ظهر.
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
          JAR="$RUNNER_TEMP/jar.txt"
          RAW="$RUNNER_TEMP/leave.raw"

          cat > "$RUNNER_TEMP/check.py" <<'PYEOF'
          import json, sys
          d = json.load(open(sys.argv[1], encoding='utf-8'))
          rows = d.get('employees') or d.get('data') or d.get('records') or []
          assert isinstance(rows, list) and rows, 'لا سجلات'
          seen = {r.get('email') or r.get('full_name') for r in rows if isinstance(r, dict)}
          print(f"سجلات: {len(rows)} · أشخاص مميّزون: {len(seen)}")
          PYEOF

          cat > "$RUNNER_TEMP/solve.py" <<'PYEOF'
          import binascii, re, subprocess, sys
          html = open(sys.argv[1], 'rb').read().decode('utf-8', 'replace')
          g = lambda n: (re.search(n + r'=toNumbers\("([0-9a-fA-F]+)"\)', html) or [None, ''])[1]
          a, b, c = g('a'), g('b'), g('c')
          if not (a and b and c):
              sys.exit(1)
          out = subprocess.run(
              ['openssl', 'enc', '-d', '-aes-128-cbc', '-K', a, '-iv', b, '-nopad'],
              input=binascii.unhexlify(c), capture_output=True)
          sys.stdout.write(out.stdout.hex())
          PYEOF

          get() {
            rm -f "$RAW"; : > "$RAW"
            curl -sSL --max-time 60 --retry 2 --retry-delay 5 \
                 -A "$UA" \
                 -H 'Accept: application/json, text/plain, */*' \
                 -H 'Accept-Language: en-US,en;q=0.9' \
                 ${1:+-H "$1"} \
                 -b "$JAR" -c "$JAR" -o "$RAW" -w '%{http_code}' "$LEAVE_URL" || echo 000
          }

          code=$(get)
          echo "المحاولة الأولى · HTTP $code · $(wc -c < "$RAW") بايت"

          if ! python3 "$RUNNER_TEMP/check.py" "$RAW" >/dev/null 2>&1; then
            if grep -q 'toNumbers' "$RAW" 2>/dev/null; then
              echo "صفحة تحقّق JavaScript — نحلّها ونعيد الطلب"
              if T=$(python3 "$RUNNER_TEMP/solve.py" "$RAW") && [ -n "$T" ]; then
                code=$(get "Cookie: __test=$T")
                echo "بعد التحقّق · HTTP $code · $(wc -c < "$RAW") بايت"
              fi
            fi
          fi

          if python3 "$RUNNER_TEMP/check.py" "$RAW" 2>/dev/null; then
            cp "$RAW" out/data/leave.json
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::مصدر الإجازات لم يُرجِع JSON — يُرفع الكود وتبقى نسخة الإجازات السابقة على الخادم"
            echo "--- أول ٤٠٠ حرف مما رجع ---"
            head -c 400 "$RAW" | tr -d '\000'
            echo ""
            echo "---------------------------"
            rm -f out/data/leave.json
            echo "fetched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: التحقق قبل الرفع
        run: |
          test -f out/index.php   || { echo "::error::index.php مفقود"; exit 1; }
          test -f out/style.css   || { echo "::error::style.css مفقود"; exit 1; }
          test -f out/app.js      || { echo "::error::app.js مفقود"; exit 1; }
          if [ -e out/config.php ]; then
            echo "::error::config.php موجود في المستودع — احذفه فوراً وغيّر كل كلمات المرور"; exit 1
          fi
          echo "حجم الرفع: $(du -sh out | cut -f1)"

      - name: الرفع عبر FTP
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
          D: ${{ secrets.FTP_DIR }}
        run: |
          if [ -z "$H" ] || [ -z "$U" ] || [ -z "$P" ] || [ -z "$D" ]; then
            echo "::error::أسرار FTP غير مضبوطة — راجعي Settings ← Secrets and variables ← Actions"
            exit 1
          fi

          # القيم مخفيّة في السجل، فنفحصها هنا لتعرفي أيّها الخاطئ
          case "$H" in
            *://*|*/*|*\ *)
              echo "::error::FTP_HOST يجب أن يكون اسم خادم فقط — بلا ftp:// وبلا مسار وبلا مسافات"
              echo "مثال صحيح: ftp.awardspace.net"
              exit 1 ;;
          esac
          if ! getent hosts "$H" > /dev/null 2>&1; then
            echo "::error::تعذّرت ترجمة FTP_HOST إلى عنوان — القيمة ليست اسم خادم صحيح"
            echo "انسخي الخادم كما هو مكتوب في: لوحة AwardSpace ← Hosting Tools ← FTP Accounts"
            exit 1
          fi
          echo "FTP_HOST صالح ويُترجم بنجاح"
          case "$D" in
            /*) echo "FTP_DIR يبدأ بشرطة مائلة" ;;
            *)  echo "::warning::FTP_DIR لا يبدأ بـ / — قد يكون هذا سبب فشل المسار" ;;
          esac

          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # كلمة المرور عبر البيئة: لا تظهر في قائمة العمليات ولا تنكسر بالرموز الخاصة.
          # كل أمر على سطر مستقل — lftp يقرأ سطراً سطراً.
          export LFTP_PASSWORD="$P"
          lftp <<LFTPEOF
          set ftp:ssl-allow true
          set ftp:ssl-force false
          set ssl:verify-certificate no
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 3
          set cmd:fail-exit true
          open -u "$U" --env-password "$H"
          pwd
          mirror -R --verbose --ignore-time --exclude-glob config.php --exclude-glob deploy.log --exclude-glob .deploy-state.json --exclude-glob probe.php --exclude-glob config.sample.php out/ "$D"
          bye
          LFTPEOF
          echo "تم الرفع بنجاح"

      - name: الخلاصة
        run: |
          {
            echo "### تم النشر"
            echo ""
            echo "| العنصر | الحالة |"
            echo "|---|---|"
            echo "| الكود | مرفوع |"
            echo "| ملف الإجازات | ${{ steps.leave.outputs.fetched == 'true' && 'مُحدَّث' || 'لم يُجلب — بقيت النسخة السابقة' }} |"
            echo "| commit | \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "البوابة: https://amnaai.atwebpages.com/ERP/"
          } >> "$GITHUB_STEP_SUMMARY"
